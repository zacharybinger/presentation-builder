name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_test.py --out /tmp/presentation-builder-ci
      - run: python scripts/package_skill.py --out dist/presentation-builder.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-builder-validation
          path: |
            dist/presentation-builder.zip
            /tmp/presentation-builder-ci/qa
            /tmp/presentation-builder-ci/pdf-review
